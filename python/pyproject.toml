[project]
name = "invar-engine"
version = "0.1.0"
description = "Invar Core AI & AST Computational Engine managed by uv sync"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.0.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "httpx-socks>=0.8.0",
    "socksio>=1.0.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["packages/core/src", ".."]
testpaths = ["tests"]
